; Opt-in ST7789 advanced statistics and SMTP profile.
; Tested on one classic ESP32 rev 3.1, dual USB CYD with 4MB flash.
[platformio]
extra_configs = platformio.ini
default_envs = cyd-mail-check

[env:cyd-mail-check]
extends = env:esp32-2432s028-2usb
board_build.embed_files = src/mail/x509_crt_bundle
board_build.embed_txtfiles = src/mail/gmail_roots.pem
board_build.partitions = partitions_cyd_4mb_check.csv
platform_packages =
    platformio/framework-arduinoespressif32@3.20014.231204
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@1.40501.0
build_flags =
    -D AUTO_VERSION=\"v2.9.6-pre-advanced1\"
    -D ESP32_2432S028=1
    -D HARDWARE_SHA256=1
    -D USE_DISPLAY=1
    -O2
    -D USER_SETUP_LOADED=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    -D LED_R_PIN=4
    -D LED_G_PIN=16
    -D LED_B_PIN=17
    -D BUTTON_PIN=0
    -D SD_CS_PIN=5
    -D ST7789_DRIVER=1
    -D SPI_FREQUENCY=27000000
    -D TFT_SPI_MODE=3
    -D ADVANCED_MAIL=1
    -D ADVANCED_FAST_KERNEL=1
    -D PIPELINED_ASM_MINING=1
    -D ADVANCED_BUILD_CHECK=1
    -D ADVANCED_SOFTWARE_RESET_CHECK=1
    -D ADVANCED_LOCAL_CONTROLS=1
    -D ADVANCED_LOCAL_ONLY_STATS=1

; Exact library versions resolved by the successful baseline build.
lib_deps =
    bblanchon/ArduinoJson@6.21.6
    https://github.com/tzapu/WiFiManager.git#d82d0a1b9fca741b9ec44accdf553606a6576dda
    mathertel/OneButton@2.6.2
    arduino-libraries/NTPClient@3.2.1
    https://github.com/takkaO/OpenFontRender#5100f1f354473c62290e7977bbc74f59363c624f
    bodmer/TFT_eSPI@2.5.43
    SD
